name: bw25-regional
channels:
  - cmutel          # bw2regional is published here
  - conda-forge
  - defaults
dependencies:
  - seaborn
  - python=3.12
  # Brightway 2.5 stack
  - brightway25=1.1.1
  - bw2data=4.5.4
  - bw2calc=2.3
  - bw2io=0.9.12
  - bw2analyzer=0.11.7
  - bw2regional=0.7.dev2   # regionalized LCA extension
  - peewee=3.16.3           # bw2data requires SqliteExtDatabase (removed in >=3.17)
  - fs                      # pyfilesystem2, required by bw2regional
  - setuptools<81           # pkg_resources removed in >=81; required by fs/bw2regional
  # NOTE: after creating this env, run: pip uninstall pypardiso
  # bw2calc pulls it in as a dependency but it requires Intel MKL which is not
  # available on all systems. Without it bw2calc falls back to scipy (slower but correct).
  # Geospatial
  - geopandas=1.1.2
  - rasterio=1.3.10
  - rasterstats=0.20.0
  - rower=0.3               # bw2regional dependency
  # Scientific Python
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy
  - matplotlib-base=3.10.8
  # Jupyter
  - jupyterlab=4.5.1
  - ipython=9.8.0
  - nbformat
  - nbconvert
